name = "cf-claude-retirement-planning"
compatibility_date = "2024-09-23"

# Cloudflare Pages serves everything in ./public as static assets,
# and everything in ./functions as Pages Functions (the /api/* endpoints).
pages_build_output_dir = "public"

# --- D1 binding -------------------------------------------------------------
# After running `wrangler d1 create retirement_calculator`, paste the printed
# database_id below. Cloudflare Pages reads this file to bind D1 as `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "retirement_calculator"
database_id = "e4f2eb61-01f8-4b1d-b3e2-63e58548bf59"

# --- Google sign-in ---------------------------------------------------------
# Three values are required; none of them belong in this file.
#
#   GOOGLE_CLIENT_ID      public, but kept with the others for symmetry
#   GOOGLE_CLIENT_SECRET  secret — never commit
#   SESSION_SECRET        secret — random string used to sign session cookies
#
# Local dev: put them in .dev.vars (gitignored).
# Production: Pages project -> Settings -> Variables and Secrets -> add as
# secrets, then redeploy. Until all three exist the app still runs; the API
# reports 503 and the UI shows "cloud storage not connected".
